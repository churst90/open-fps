# The whole test suite on GitHub's runners instead of the development machine.
#
# Eight runners each take an eighth of the test classes (tools/ci/shard_tests.py), so the suite that
# takes 48 minutes on 24 cores finishes in well under an hour on 4-core runners. The tests need no
# FMOD or Steam Audio libraries (none of them loads the native audio engine), only .NET and Python
# (RoadNetworkTests regenerates the city with tools/gen_city.py).
#
# Runs on every push to main, on pull requests, and by hand from the Actions tab
# ("Run workflow"). A newer push to the same branch cancels the run still going.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: dotnet build OpenFPS.Tests -c Debug

      - name: Pick this runner's share of the tests
        id: shard
        run: |
          dotnet test OpenFPS.Tests -c Debug --no-build --list-tests > tests.txt
          echo "filter=$(python3 tools/ci/shard_tests.py ${{ matrix.shard }} 8 < tests.txt)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: >
          dotnet test OpenFPS.Tests -c Debug --no-build
          --filter "${{ steps.shard.outputs.filter }}"
          --blame-hang-timeout 10m --blame-hang-dump-type none
          --logger "trx;LogFileName=shard-${{ matrix.shard }}.trx"
          --logger "console;verbosity=minimal"
          --results-directory TestResults

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: TestResults
          retention-days: 14
